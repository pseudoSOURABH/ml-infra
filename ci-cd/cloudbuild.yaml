substitutions:
  _REGION: us-central1
  _CLUSTER: ml-platform-cluster
  _CLUSTER_ZONE: us-central1-a

options:
  logging: CLOUD_LOGGING_ONLY
  dynamic_substitutions: true
  machineType: 'E2_HIGHCPU_8'

timeout: '3000s'