# Cloud Build pipeline for ML inference platform
# Triggered on: feature branch commits, tags (auto-deploy)

steps:
  # Step 0: Setup - Install dependencies
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'setup'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud components install kubectl gke-gcloud-auth-plugin --quiet
        pip install -r model_pipeline/requirements.txt

  # Step 1: Run model processing pipeline
  - name: 'python:3.12-slim'
    id: 'run-pipeline'
    waitFor: ['setup']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        python model_pipeline/run_pipeline.py \
          --model bvanaken/clinical-assertion-negation-bert \
          --output ./output \
          --gcs-uri gs://$PROJECT_ID-ml-models/clinical_assertion \
          --project-id $PROJECT_ID \
          --threshold 0.95
    env:
      - 'PROJECT_ID=$PROJECT_ID'
      - 'GOOGLE_CLOUD_PROJECT=$PROJECT_ID'

  # Step 2: Build backend Docker image (Parallel)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    waitFor: ['run-pipeline']
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/ml-repo/backend:$COMMIT_SHA'
      - '-f'
      - 'Dockerfile.backend'
      - '--build-arg'
      - 'TRITON_GRPC_PORT=8001'
      - '.'

  # Step 3: Build frontend Docker image (Parallel)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    waitFor: ['run-pipeline']
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/ml-repo/frontend:$COMMIT_SHA'
      - '-f'
      - 'Dockerfile.frontend'
      - '.'

  # Step 4: Push images to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-images'
    waitFor: ['build-backend', 'build-frontend']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker push ${_REGION}-docker.pkg.dev/$PROJECT_ID/ml-repo/backend:$COMMIT_SHA
        docker push ${_REGION}-docker.pkg.dev/$PROJECT_ID/ml-repo/frontend:$COMMIT_SHA

  # Step 5: Deploy to GKE (Conditional logic moved inside args)
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy'
    waitFor: ['push-images']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [[ "$BRANCH_NAME" == "feat/deploy-model" || "$TAG_NAME" != "" ]]; then
          echo "Conditions met. Starting deployment..."
          
          gcloud container clusters get-credentials $_CLUSTER \
            --region $_REGION --project $PROJECT_ID
          
          export IMAGE_TAG=$COMMIT_SHA
          
          kubectl apply -f k8s/namespaces.yaml
          kubectl apply -f k8s/kserve-config.yaml
          
          envsubst < k8s/triton-inference.yaml | kubectl apply -f -
          envsubst < k8s/backend-deployment.yaml | kubectl apply -f -
          envsubst < k8s/frontend-deployment.yaml | kubectl apply -f -
          envsubst < k8s/ingress.yaml | kubectl apply -f -
          
          echo "Deployment complete!"
        else
          echo "Skipping deployment: Branch $BRANCH_NAME does not match deployment criteria."
        fi
    env:
      - 'PROJECT_ID=$PROJECT_ID'
      - 'REGION=$_REGION'
      - 'COMMIT_SHA=$COMMIT_SHA'

  # Step 6: Run smoke tests (Conditional logic moved inside args)
  - name: 'python:3.12-slim'
    id: 'smoke-tests'
    waitFor: ['deploy']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [[ "$BRANCH_NAME" == "feat/deploy-model" || "$TAG_NAME" != "" ]]; then
          pip install httpx
          python -c "
        import httpx, time, sys, os
        base = os.getenv('DOMAIN_NAME', 'http://your-static-ip')
        for _ in range(60):
            try:
                r = httpx.get(f'{base}/health', timeout=10)
                if r.status_code == 200:
                    print('✓ Health check passed')
                    sys.exit(0)
            except Exception as e:
                print(f'Waiting for service... {e}')
            time.sleep(10)
        print('✗ Health check failed')
        sys.exit(1)
        "
        else
          echo "Skipping smoke tests for non-deployment branch."
        fi

substitutions:
  _REGION: us-central1
  _CLUSTER: ml-platform-cluster

timeout: '1800s'

options:
  logging: CLOUD_LOGGING_ONLY