steps:
  # ── 0: Pull pipeline runner cache ────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'pull-pipeline-cache'
    waitFor: ['-']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker pull us-central1-docker.pkg.dev/$PROJECT_ID/ml-repo/pipeline-runner:latest \
          || true

  # ── 1: Pull backend/frontend cache in parallel ───────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'pull-app-cache'
    waitFor: ['-']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker pull ${_REGION}-docker.pkg.dev/$PROJECT_ID/ml-repo/clinical-backend:latest || true &
        docker pull ${_REGION}-docker.pkg.dev/$PROJECT_ID/ml-repo/clinical-frontend:latest || true &
        wait

  # ── 2: Build pipeline runner image ───────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-pipeline-image'
    waitFor: ['pull-pipeline-cache']
    dir: '.'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/ml-repo/pipeline-runner:latest'
      - '--cache-from'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/ml-repo/pipeline-runner:latest'
      - '-f'
      - 'Dockerfile.pipeline'
      - '.'

  # ── 2b: Push pipeline image ──────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-pipeline-image'
    waitFor: ['build-pipeline-image']
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/ml-repo/pipeline-runner:latest'

  # ── 3: Run model pipeline (conversion → quantisation → GCS upload) ───────
  - name: 'us-central1-docker.pkg.dev/$PROJECT_ID/ml-repo/pipeline-runner:latest'
    id: 'run-pipeline'
    waitFor: ['push-pipeline-image']
    entrypoint: 'python'
    args:
      - 'model_pipeline/run_pipeline.py'
      - '--model'
      - 'bvanaken/clinical-assertion-negation-bert'
      - '--output'
      - '/workspace/output'
      - '--gcs-uri'
      - 'gs://$PROJECT_ID-ml-models/clinical_assertion'
      - '--project-id'
      - '$PROJECT_ID'
      - '--threshold'
      - '0.95'
    env:
      - 'PROJECT_ID=$PROJECT_ID'
      - 'HF_HOME=/app/hf_cache'
      - 'TRANSFORMERS_OFFLINE=1'
      - 'HF_HUB_OFFLINE=1'

  # ── 4a: Build backend image ──────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    waitFor: ['pull-app-cache']
    dir: '.'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/ml-repo/clinical-backend:$COMMIT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/ml-repo/clinical-backend:latest'
      - '--cache-from'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/ml-repo/clinical-backend:latest'
      - '-f'
      - 'Dockerfile.backend'
      - '--build-arg'
      - 'TRITON_GRPC_PORT=9000'    # ✅ Updated to actual gRPC port
      - '.'

  # ── 4b: Build frontend image ─────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    waitFor: ['pull-app-cache']
    dir: '.'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/ml-repo/clinical-frontend:$COMMIT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/ml-repo/clinical-frontend:latest'
      - '--cache-from'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/ml-repo/clinical-frontend:latest'
      - '-f'
      - 'Dockerfile.frontend'
      - '.'

  # ── 5: Push all images in parallel ───────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-images'
    waitFor: ['build-backend', 'build-frontend', 'run-pipeline']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker push ${_REGION}-docker.pkg.dev/$PROJECT_ID/ml-repo/clinical-backend:$COMMIT_SHA &
        docker push ${_REGION}-docker.pkg.dev/$PROJECT_ID/ml-repo/clinical-backend:latest &
        docker push ${_REGION}-docker.pkg.dev/$PROJECT_ID/ml-repo/clinical-frontend:$COMMIT_SHA &
        docker push ${_REGION}-docker.pkg.dev/$PROJECT_ID/ml-repo/clinical-frontend:latest &
        wait

  # # ── 6: Deploy to GKE ─────────────────────────────────────────────────────
  # - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  #   id: 'deploy'
  #   waitFor: ['push-images']
  #   dir: '.'
  #   entrypoint: 'bash'
  #   args:
  #     - '-c'
  #     - |
  #       if [[ "$BRANCH_NAME" != "feat/model-deployment-pipeline" && -z "$TAG_NAME" ]]; then
  #         echo "Skipping deployment for branch: $BRANCH_NAME"
  #         exit 0
  #       fi

  #       apt-get update -qq && apt-get install -y -qq gettext-base

  #       gcloud container clusters get-credentials $_CLUSTER \
  #         --zone $_CLUSTER_ZONE --project $PROJECT_ID

  #       export COMMIT_SHA=$COMMIT_SHA
  #       export PROJECT_ID=$PROJECT_ID
  #       export REGION=$_REGION

  #       # 1. Create namespaces (idempotent)
  #       kubectl apply -f k8s/namespaces.yaml

  #       # 2. Deploy KServe InferenceService for Triton
  #       envsubst < k8s/triton-inference.yaml | kubectl apply -f -

  #       # 3. Create the dedicated gRPC service (stable endpoint)
  #       kubectl apply -f k8s/triton-grpc-service.yaml

  #       # 4. Wait for InferenceService to be ready before deploying backend
  #       echo "Waiting for InferenceService to be ready..."
  #       kubectl wait --for=condition=Ready --timeout=300s inferenceservice/clinical-assertion -n triton

  #       # 5. Deploy backend and frontend
  #       envsubst < k8s/backend-deployment.yaml  | kubectl apply -f -
  #       envsubst < k8s/frontend-deployment.yaml | kubectl apply -f -

  #       # 6. Apply BackendConfig for LoadBalancer health check (optional)
  #       kubectl apply -f k8s/backendconfig.yaml

  #       # 7. Apply Ingress (if you prefer Ingress over direct LoadBalancer)
  #       # envsubst < k8s/ingress.yaml | kubectl apply -f -

  #       # 8. Wait for deployments to roll out
  #       kubectl rollout status deployment/clinical-backend  -n api      --timeout=300s
  #       kubectl rollout status deployment/clinical-frontend -n frontend  --timeout=300s

  #       echo "Deployment complete!"
  #   env:
  #     - 'PROJECT_ID=$PROJECT_ID'
