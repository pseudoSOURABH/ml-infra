steps:
  # ── Setup ─────────────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'setup'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud components install kubectl gke-gcloud-auth-plugin --quiet

  # ── Build pipeline-runner ──────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-pipeline-image'
    waitFor: ['-']
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/ml-repo/pipeline-runner:$COMMIT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/ml-repo/pipeline-runner:latest'
      - '--cache-from'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/ml-repo/pipeline-runner:latest'
      - '-f'
      - 'Dockerfile.pipeline'
      - '.'

  # Push immediately — must exist before run-pipeline references it by name
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-pipeline-image'
    waitFor: ['build-pipeline-image']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker push us-central1-docker.pkg.dev/$PROJECT_ID/ml-repo/pipeline-runner:$COMMIT_SHA
        docker push us-central1-docker.pkg.dev/$PROJECT_ID/ml-repo/pipeline-runner:latest

  # ── GCS cache check ────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'check-model-cache'
    waitFor: ['-']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if gsutil -q stat gs://$PROJECT_ID-ml-models/clinical_assertion/.pipeline_done 2>/dev/null; then
          echo "CACHE_HIT=true" > /workspace/pipeline_cache.env
          echo "✓ Model artifact found in GCS — skipping pipeline."
        else
          echo "CACHE_HIT=false" > /workspace/pipeline_cache.env
          echo "Cache miss — pipeline will run."
        fi

  # ── Run model pipeline ─────────────────────────────────────────────────────
  # IMPORTANT: Cloud Build does NOT substitute variables in the `name` field.
  # Solution: use a fixed :latest tag for the runner name, but the actual
  # image was just pushed above with both :latest AND :$COMMIT_SHA tags,
  # so :latest == this commit's image at this point in the build.
  - name: 'us-central1-docker.pkg.dev/$PROJECT_ID/ml-repo/pipeline-runner:latest'
    id: 'run-pipeline'
    waitFor: ['push-pipeline-image', 'check-model-cache']
    entrypoint: 'python'
    args:
      - 'model_pipeline/run_pipeline.py'
      - '--model'
      - 'bvanaken/clinical-assertion-negation-bert'
      - '--output'
      - './output'
      - '--gcs-uri'
      - 'gs://$PROJECT_ID-ml-models/clinical_assertion'
      - '--project-id'
      - '$PROJECT_ID'
      - '--threshold'
      - '0.95'
      - '--cache-env'
      - '/workspace/pipeline_cache.env'
    env:
      - 'PROJECT_ID=$PROJECT_ID'
      - 'HF_HOME=/workspace/.hf_cache'

  # ── Build backend ──────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    waitFor: ['run-pipeline']
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/ml-repo/backend:$COMMIT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/ml-repo/backend:latest'
      - '-f'
      - 'Dockerfile.backend'
      - '--build-arg'
      - 'TRITON_GRPC_PORT=8001'
      - '--cache-from'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/ml-repo/backend:latest'
      - '.'

  # ── Build frontend ─────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    waitFor: ['run-pipeline']
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/ml-repo/frontend:$COMMIT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/ml-repo/frontend:latest'
      - '-f'
      - 'Dockerfile.frontend'
      - '--cache-from'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/ml-repo/frontend:latest'
      - '.'

  # ── Push backend + frontend ────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-images'
    waitFor: ['build-backend', 'build-frontend']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker push ${_REGION}-docker.pkg.dev/$PROJECT_ID/ml-repo/backend:$COMMIT_SHA &
        docker push ${_REGION}-docker.pkg.dev/$PROJECT_ID/ml-repo/backend:latest &
        docker push ${_REGION}-docker.pkg.dev/$PROJECT_ID/ml-repo/frontend:$COMMIT_SHA &
        docker push ${_REGION}-docker.pkg.dev/$PROJECT_ID/ml-repo/frontend:latest &
        wait

  # ── Deploy to GKE ──────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy'
    waitFor: ['push-images', 'setup']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        apt-get update -qq && apt-get install -y -qq gettext-base

        if [[ "$BRANCH_NAME" == "feat/deploy-model" || "$TAG_NAME" != "" ]]; then
          echo "Deploying commit $COMMIT_SHA..."

          gcloud container clusters get-credentials ${_CLUSTER} \
            --region ${_REGION} --project $PROJECT_ID

          # Set environment variables for envsubst
          export IMAGE_TAG="$COMMIT_SHA"
          export REGION="${_REGION}"
          export MODEL_GCS_URI="gs://$PROJECT_ID-ml-models/clinical_assertion"

          kubectl apply -f k8s/namespaces.yaml

          # ✅ ESCAPED: $$ becomes literal $ after Cloud Build substitution
          envsubst '$${MODEL_GCS_URI}' \
            < k8s/triton-inference.yaml | kubectl apply -f -

          envsubst '$${IMAGE_TAG} $${PROJECT_ID} $${REGION}' \
            < k8s/backend-deployment.yaml | kubectl apply -f -

          envsubst '$${IMAGE_TAG} $${PROJECT_ID} $${REGION}' \
            < k8s/frontend-deployment.yaml | kubectl apply -f -

          kubectl apply -f k8s/ingress.yaml

          echo "✓ Deployment complete — image: $COMMIT_SHA  model: $MODEL_GCS_URI"
        else
          echo "Skipping deployment for branch: $BRANCH_NAME"
        fi
    env:
      - 'USE_GKE_GCLOUD_AUTH_PLUGIN=True'

  # ── Smoke tests ────────────────────────────────────────────────────────────
  - name: 'python:3.12-slim'
    id: 'smoke-tests'
    waitFor: ['deploy']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [[ "$BRANCH_NAME" == "feat/deploy-model" || "$TAG_NAME" != "" ]]; then
          pip install --quiet httpx
          python -c "
        import httpx, time, sys, os
        base = os.getenv('DOMAIN_NAME', 'http://your-static-ip')
        for _ in range(30):
            try:
                r = httpx.get(f'{base}/health', timeout=5)
                if r.status_code == 200:
                    print('✓ Health check passed')
                    sys.exit(0)
            except:
                pass
            time.sleep(10)
        print('✗ Health check failed')
        sys.exit(1)"
        fi

# Only user-defined substitutions here (_PREFIX required).
# Built-ins like $PROJECT_ID, $COMMIT_SHA, $BRANCH_NAME, $TAG_NAME
# are provided automatically by Cloud Build — never declare them here.
substitutions:
  _REGION: us-central1
  _CLUSTER: ml-platform-cluster

options:
  logging: CLOUD_LOGGING_ONLY
  dynamic_substitutions: true
  machineType: 'E2_HIGHCPU_8'

timeout: '3000s'