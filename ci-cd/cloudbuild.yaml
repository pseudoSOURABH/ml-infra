steps:
  # ── Setup ─────────────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'setup'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud components install kubectl gke-gcloud-auth-plugin --quiet

  # ── Compute rich image tag ─────────────────────────────────────────────────
  # Tag format: {short-sha}-{sanitized-branch}-{YYYYMMDD}
  # e.g.  a1b2c3d-feat-deploy-model-20260413
  # Written to /workspace/image_tag.env so every subsequent step reads the
  # exact same value — no drift between build and deploy steps.
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'compute-image-tag'
    waitFor: ['-']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        SHORT_SHA="${COMMIT_SHA:0:8}"
        DATE_TAG=$(date -u +%Y%m%d)

        # Sanitize branch name: lowercase, replace non-alphanumeric with '-',
        # truncate to 30 chars so the full tag stays Docker-safe (<128 chars).
        BRANCH_SAFE=$(echo "${BRANCH_NAME}" \
          | tr '[:upper:]' '[:lower:]' \
          | sed 's/[^a-z0-9]/-/g' \
          | cut -c1-30 \
          | sed 's/-*$//')

        IMAGE_TAG="${SHORT_SHA}-${BRANCH_SAFE}-${DATE_TAG}"

        echo "IMAGE_TAG=${IMAGE_TAG}" > /workspace/image_tag.env
        echo "✓ Image tag: ${IMAGE_TAG}"

  # ── Build pipeline-runner ──────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-pipeline-image'
    waitFor: ['compute-image-tag']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        source /workspace/image_tag.env
        docker build \
          -t us-central1-docker.pkg.dev/$PROJECT_ID/ml-repo/pipeline-runner:${IMAGE_TAG} \
          -t us-central1-docker.pkg.dev/$PROJECT_ID/ml-repo/pipeline-runner:latest \
          --cache-from us-central1-docker.pkg.dev/$PROJECT_ID/ml-repo/pipeline-runner:latest \
          -f Dockerfile.pipeline \
          .

  # Push immediately — must exist before run-pipeline references it by name
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-pipeline-image'
    waitFor: ['build-pipeline-image']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        source /workspace/image_tag.env
        docker push us-central1-docker.pkg.dev/$PROJECT_ID/ml-repo/pipeline-runner:${IMAGE_TAG}
        docker push us-central1-docker.pkg.dev/$PROJECT_ID/ml-repo/pipeline-runner:latest

  # ── GCS cache check ────────────────────────────────────────────────────────
  # MODEL_GCS_URI is the canonical path used by BOTH run_pipeline.py (upload)
  # and the Triton InferenceService (storageUri).  It is defined once here as
  # _MODEL_GCS_URI in substitutions and written to a shared env file so the
  # deploy step can inject the exact same value into the K8s manifest — no
  # risk of the two values drifting apart.
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'check-model-cache'
    waitFor: ['-']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Write the canonical model GCS URI to the shared env file so the
        # deploy step can read it without re-constructing the path.
        echo "MODEL_GCS_URI=${_MODEL_GCS_URI}" > /workspace/model_gcs.env

        if gsutil -q stat ${_MODEL_GCS_URI}/.pipeline_done 2>/dev/null; then
          echo "CACHE_HIT=true" > /workspace/pipeline_cache.env
          echo "✓ Model artifact found in GCS — skipping pipeline."
        else
          echo "CACHE_HIT=false" > /workspace/pipeline_cache.env
          echo "Cache miss — pipeline will run."
        fi

  # ── Run model pipeline ─────────────────────────────────────────────────────
  # IMPORTANT: Cloud Build does NOT substitute variables in the `name` field.
  # We use :latest here — that tag was just pushed above and equals this
  # commit's image, so there is no stale-image risk within the same build.
  - name: 'us-central1-docker.pkg.dev/$PROJECT_ID/ml-repo/pipeline-runner:latest'
    id: 'run-pipeline'
    waitFor: ['push-pipeline-image', 'check-model-cache']
    entrypoint: 'python'
    args:
      - 'model_pipeline/run_pipeline.py'
      - '--model'
      - 'bvanaken/clinical-assertion-negation-bert'
      - '--output'
      - './output'
      # ↓ Same URI written to /workspace/model_gcs.env — single source of truth
      - '--gcs-uri'
      - '${_MODEL_GCS_URI}'
      - '--project-id'
      - '$PROJECT_ID'
      - '--threshold'
      - '0.95'
      - '--cache-env'
      - '/workspace/pipeline_cache.env'
    env:
      - 'PROJECT_ID=$PROJECT_ID'
      - 'HF_HOME=/workspace/.hf_cache'

  # ── Build backend ──────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    waitFor: ['run-pipeline', 'compute-image-tag']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        source /workspace/image_tag.env
        docker build \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/ml-repo/backend:${IMAGE_TAG} \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/ml-repo/backend:latest \
          -f Dockerfile.backend \
          --build-arg TRITON_GRPC_PORT=8001 \
          --cache-from ${_REGION}-docker.pkg.dev/$PROJECT_ID/ml-repo/backend:latest \
          .

  # ── Build frontend ─────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    waitFor: ['run-pipeline', 'compute-image-tag']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        source /workspace/image_tag.env
        docker build \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/ml-repo/frontend:${IMAGE_TAG} \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/ml-repo/frontend:latest \
          -f Dockerfile.frontend \
          --cache-from ${_REGION}-docker.pkg.dev/$PROJECT_ID/ml-repo/frontend:latest \
          .

  # ── Push backend + frontend ────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-images'
    waitFor: ['build-backend', 'build-frontend']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        source /workspace/image_tag.env
        docker push ${_REGION}-docker.pkg.dev/$PROJECT_ID/ml-repo/backend:${IMAGE_TAG} &
        docker push ${_REGION}-docker.pkg.dev/$PROJECT_ID/ml-repo/backend:latest &
        docker push ${_REGION}-docker.pkg.dev/$PROJECT_ID/ml-repo/frontend:${IMAGE_TAG} &
        docker push ${_REGION}-docker.pkg.dev/$PROJECT_ID/ml-repo/frontend:latest &
        wait

  # ── Deploy to GKE ──────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy'
    waitFor: ['push-images', 'setup']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [[ "$BRANCH_NAME" == "feat/deploy-model" || "$TAG_NAME" != "" ]]; then
          echo "🚀 Deploying..."

          source /workspace/image_tag.env
          source /workspace/model_gcs.env

          echo "  IMAGE_TAG:     ${IMAGE_TAG}"
          echo "  MODEL_GCS_URI: ${MODEL_GCS_URI}"

          cp -r scripts /workspace/ 2>/dev/null || true

          # IMAGE_TAG (rich tag) and MODEL_GCS_URI are both sourced from the
          # shared env files written earlier — single source of truth for both.
          bash /workspace/scripts/deploy-k8s.sh \
            "${_CLUSTER}" \
            "${_REGION}" \
            "$PROJECT_ID" \
            "${IMAGE_TAG}" \
            "${MODEL_GCS_URI}"

          echo "✓ Deployment complete"
        else
          echo "⏭ Skipping deployment for branch: $BRANCH_NAME"
        fi
    env:
      - 'USE_GKE_GCLOUD_AUTH_PLUGIN=True'

  # ── Smoke tests ────────────────────────────────────────────────────────────
  - name: 'python:3.12-slim'
    id: 'smoke-tests'
    waitFor: ['deploy']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [[ "$BRANCH_NAME" == "feat/deploy-model" || "$TAG_NAME" != "" ]]; then
          pip install --quiet httpx
          python -c "
        import httpx, time, sys, os
        base = os.getenv('DOMAIN_NAME', 'http://your-static-ip')
        for _ in range(30):
            try:
                r = httpx.get(f'{base}/health', timeout=5)
                if r.status_code == 200:
                    print('✓ Health check passed')
                    sys.exit(0)
            except:
                pass
            time.sleep(10)
        print('✗ Health check failed')
        sys.exit(1)"
        fi

# ── Substitutions ──────────────────────────────────────────────────────────
# Only user-defined substitutions here (_PREFIX required).
# Built-ins ($PROJECT_ID, $COMMIT_SHA, $BRANCH_NAME, $TAG_NAME) are provided
# automatically by Cloud Build — never declare them here.
substitutions:
  _REGION: us-central1
  _CLUSTER: ml-platform-cluster
  # Single declaration of the model GCS path.
  # run_pipeline.py uploads TO this URI.
  # deploy-k8s.sh injects this URI into the Triton InferenceService manifest.
  # Both sides always agree because they read the same value.
  _MODEL_GCS_URI: 'gs://$PROJECT_ID-ml-models/clinical_assertion'

options:
  logging: CLOUD_LOGGING_ONLY
  dynamic_substitutions: true
  machineType: 'E2_HIGHCPU_8'

timeout: '3000s'