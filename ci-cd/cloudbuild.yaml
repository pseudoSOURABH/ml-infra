steps:
  # ── 0: Pull pipeline runner cache ────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'pull-pipeline-cache'
    waitFor: ['-']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker pull us-central1-docker.pkg.dev/$PROJECT_ID/ml-repo/pipeline-runner:latest \
          || true

  # ── 1: Pull backend/frontend cache in parallel ───────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'pull-app-cache'
    waitFor: ['-']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker pull ${_REGION}-docker.pkg.dev/$PROJECT_ID/ml-repo/backend:latest || true &
        docker pull ${_REGION}-docker.pkg.dev/$PROJECT_ID/ml-repo/frontend:latest || true &
        wait

  # ── 2: Build pipeline runner image ───────────────────────────────────────
  # dir: '.' sets cwd to /workspace (repo root ml-infra/ml-infra/) so:
  #   -f Dockerfile.pipeline  → /workspace/Dockerfile.pipeline  ✓
  #   .  (build context)      → /workspace/ which contains model_pipelinee/
  #                             and model_repository/  ✓
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-pipeline-image'
    waitFor: ['pull-pipeline-cache']
    dir: '.'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/ml-repo/pipeline-runner:latest'
      - '--cache-from'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/ml-repo/pipeline-runner:latest'
      - '-f'
      - 'Dockerfile.pipeline'
      - '.'

  # ── 3: Run model pipeline ─────────────────────────────────────────────────
  # Cloud Build mounts /workspace into the container automatically.
  # HF model weights are baked into the image at /app/hf_cache.
  # Dockerfile.pipeline COPYs source to /workspace/model_pipeline/ and sets
  # WORKDIR /workspace — so run_pipeline.py is at model_pipeline/run_pipeline.py
  # relative to cwd, and sibling imports (convert_to_onnx, etc.) resolve correctly.
  - name: 'us-central1-docker.pkg.dev/$PROJECT_ID/ml-repo/pipeline-runner:latest'
    id: 'run-pipeline'
    waitFor: ['build-pipeline-image']
    entrypoint: 'python'
    args:
      - 'model_pipeline/run_pipeline.py'   # relative to WORKDIR /workspace inside image
      - '--model'
      - 'bvanaken/clinical-assertion-negation-bert'
      - '--output'
      - '/workspace/output'
      - '--gcs-uri'
      - 'gs://$PROJECT_ID-ml-models/clinical_assertion'
      - '--project-id'
      - '$PROJECT_ID'
      - '--threshold'
      - '0.95'
    env:
      - 'PROJECT_ID=$PROJECT_ID'
      - 'HF_HOME=/app/hf_cache'        # must match Dockerfile.pipeline ENV
      - 'TRANSFORMERS_OFFLINE=1'        # use baked cache, never hit HF network
      - 'HF_HUB_OFFLINE=1'

  # ── 4a: Build backend (parallel with frontend, no pipeline dependency) ────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    waitFor: ['pull-app-cache']
    dir: '.'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/ml-repo/backend:$COMMIT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/ml-repo/backend:latest'
      - '--cache-from'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/ml-repo/backend:latest'
      - '-f'
      - 'Dockerfile.backend'
      - '--build-arg'
      - 'TRITON_GRPC_PORT=8001'
      - '.'

  # ── 4b: Build frontend (parallel with backend) ───────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    waitFor: ['pull-app-cache']
    dir: '.'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/ml-repo/frontend:$COMMIT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/ml-repo/frontend:latest'
      - '--cache-from'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/ml-repo/frontend:latest'
      - '-f'
      - 'Dockerfile.frontend'
      - '.'

  # ── 5: Push all images in parallel ───────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-images'
    waitFor: ['build-backend', 'build-frontend', 'run-pipeline']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker push ${_REGION}-docker.pkg.dev/$PROJECT_ID/ml-repo/backend:$COMMIT_SHA &
        docker push ${_REGION}-docker.pkg.dev/$PROJECT_ID/ml-repo/backend:latest &
        docker push ${_REGION}-docker.pkg.dev/$PROJECT_ID/ml-repo/frontend:$COMMIT_SHA &
        docker push ${_REGION}-docker.pkg.dev/$PROJECT_ID/ml-repo/frontend:latest &
        docker push us-central1-docker.pkg.dev/$PROJECT_ID/ml-repo/pipeline-runner:latest &
        wait

  # ── 6: Deploy to GKE ─────────────────────────────────────────────────────
  # Full cloud-sdk image (NOT :slim) — has kubectl + gke-gcloud-auth-plugin
  # pre-installed. :slim strips both and blocks gcloud components install.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy'
    waitFor: ['push-images']
    dir: '.'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [[ "$BRANCH_NAME" != "feat/model-deployment-pipeline" && -z "$TAG_NAME" ]]; then
          echo "Skipping deployment for branch: $BRANCH_NAME"
          exit 0
        fi

        apt-get update -qq && apt-get install -y -qq gettext-base

        # --zone not --region: cluster is ZONAL (us-central1-a), not regional.
        gcloud container clusters get-credentials $_CLUSTER \
          --zone $_CLUSTER_ZONE --project $PROJECT_ID

        export IMAGE_TAG=$COMMIT_SHA
        export PROJECT_ID=$PROJECT_ID
        export REGION=$_REGION

        kubectl apply -f k8s/namespaces.yaml
        kubectl apply -f k8s/kserve-config.yaml
        envsubst < k8s/triton-inference.yaml    | kubectl apply -f -
        envsubst < k8s/backend-deployment.yaml  | kubectl apply -f -
        envsubst < k8s/frontend-deployment.yaml | kubectl apply -f -
        envsubst < k8s/ingress.yaml             | kubectl apply -f -

        kubectl rollout status deployment/clinical-backend -n api --timeout=300s
        kubectl rollout status deployment/frontend -n frontend --timeout=300s

        echo "Deployment complete!"
    env:
      - 'PROJECT_ID=$PROJECT_ID'
      - 'BRANCH_NAME=$BRANCH_NAME'
      - 'TAG_NAME=$TAG_NAME'
      - 'COMMIT_SHA=$COMMIT_SHA'
      - '_CLUSTER=$_CLUSTER'
      - '_CLUSTER_ZONE=$_CLUSTER_ZONE'
      - '_REGION=$_REGION'

  # ── 7: Smoke tests (commented out until _DOMAIN_NAME is set) ─────────────
  # - name: 'python:3.12-slim'
  #   id: 'smoke-tests'
  #   waitFor: ['deploy']
  #   entrypoint: 'bash'
  #   args:
  #     - '-c'
  #     - |
  #       if [[ "$BRANCH_NAME" != "feat/model-deployment-pipeline" && -z "$TAG_NAME" ]]; then
  #         echo "Skipping smoke tests for branch: $BRANCH_NAME"
  #         exit 0
  #       fi
  #       pip install --quiet httpx
  #       python - <<'EOF'
  #       import httpx, time, sys, os
  #       base = os.environ["DOMAIN_NAME"]
  #       print(f"Running smoke test against {base}")
  #       for attempt in range(30):
  #           try:
  #               r = httpx.get(f"{base}/health", timeout=5)
  #               if r.status_code == 200:
  #                   print("✓ Health check passed")
  #                   sys.exit(0)
  #               print(f"  attempt {attempt+1}: got {r.status_code}, retrying...")
  #           except Exception as e:
  #               print(f"  attempt {attempt+1}: {e}, retrying...")
  #           time.sleep(10)
  #       print("✗ Health check failed after 30 attempts")
  #       sys.exit(1)
  #       EOF
  #   env:
  #     - 'BRANCH_NAME=$BRANCH_NAME'
  #     - 'TAG_NAME=$TAG_NAME'
  #     - 'DOMAIN_NAME=$_DOMAIN_NAME'

substitutions:
  _REGION: us-central1
  _CLUSTER: ml-platform-cluster
  _CLUSTER_ZONE: us-central1-a        # ZONAL cluster — confirm with: gcloud container clusters list
  # _DOMAIN_NAME: 'http://your-static-ip'  # uncomment when enabling smoke tests

options:
  logging: CLOUD_LOGGING_ONLY
  dynamic_substitutions: true
  machineType: 'E2_HIGHCPU_8'

timeout: '3000s'