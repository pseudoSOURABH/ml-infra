# Local CI/CD simulation using Docker
# Run with: gcloud builds submit --config=ci-cd/cloudbuild-local.yaml --project=$PROJECT_ID

steps:
  # Build images locally
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'backend:local', '-f', 'Dockerfile.backend', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'frontend:local', '-f', 'Dockerfile.frontend', '.']
  
  # Run model pipeline (dry-run mode)
  - name: 'python:3.12-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "=== Local CI/CD Test ==="
        echo "Model pipeline would run with:"
        echo "  - Model: bvanaken/clinical-assertion-negation-bert"
        echo "  - Output: ./output/model_repository"
        echo "  - GCS Upload: SKIPPED (local mode)"
        echo "✓ Pipeline simulation complete"
    env:
      - 'LOCAL_TEST=true'

  # Validate Kubernetes manifests
  - name: 'gcr.io/cloud-builders/kubectl'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Validating Kubernetes manifests..."
        for f in k8s/*.yaml; do
          kubectl apply --dry-run=client -f $f 2>&1 | grep -v "created\|configured" || true
        done
        echo "✓ Manifest validation complete"

images:
  - 'backend:local'
  - 'frontend:local'