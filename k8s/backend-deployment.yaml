apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinical-backend
  namespace: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: clinical-backend
  template:
    metadata:
      labels:
        app: clinical-backend
        version: v1
    spec:
      serviceAccountName: api-sa
      containers:
        - name: backend
          image: ${REGION}-docker.pkg.dev/${PROJECT_ID}/ml-repo/clinical-backend:${COMMIT_SHA}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: TRITON_URL
              value: "clinical-assertion-http.triton.svc.cluster.local:8080"
            - name: MODEL_NAME
              value: "clinical_assertion"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /home/appuser/.cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: clinical-backend-service
  namespace: api
  labels:
    app: clinical-backend
spec:
  type: ClusterIP
  selector:
    app: clinical-backend
  ports:
    - name: http
      port: 80
      targetPort: 8080