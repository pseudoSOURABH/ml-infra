apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: clinical-assertion
  namespace: triton
  annotations:
    serving.kserve.io/deploymentMode: "Serverless"
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 3
    model:
      modelFormat:
        name: triton
      runtime: triton
      # @@MODEL_GCS_URI@@ is replaced by deploy-k8s.sh with the value sourced
      # from /workspace/model_gcs.env, which is written by the check-model-cache
      # step using _MODEL_GCS_URI from substitutions.
      #
      # That is the exact same URI passed to run_pipeline.py via --gcs-uri, so
      # the path Triton reads from is always the path the pipeline uploaded to.
      #
      # run_pipeline.py uploads the Triton model repository layout:
      #   {_MODEL_GCS_URI}/config.pbtxt
      #   {_MODEL_GCS_URI}/1/model.onnx
      #   {_MODEL_GCS_URI}/1/tokenizer.json   (etc.)
      #
      # KServe/Triton expects storageUri to point at the model directory
      # (one level above the version directory), which matches exactly.
      storageUri: "@@MODEL_GCS_URI@@"
      resources:
        requests:
          cpu: "1000m"
          memory: "2Gi"
        limits:
          cpu: "2000m"
          memory: "4Gi"
      env:
        - name: OMP_NUM_THREADS
          value: "2"
        - name: ONNXRUNTIME_EXECUTION_MODE
          value: "ORT_SEQUENTIAL"
        - name: ONNXRUNTIME_INTER_OP_PARALLELISM
          value: "2"
        - name: ONNXRUNTIME_INTRA_OP_PARALLELISM
          value: "2"
    componentSpecs:
      - spec:
          containers:
            - name: kserve-container
              image: docker.io/kserve/tritonserver:23.12-py3
              command: ["tritonserver"]
              args:
                - "--model-repository=/mnt/models"
                - "--strict-model-config=false"
                - "--http-port=8080"
                - "--grpc-port=8001"
                - "--metrics-port=8002"
                - "--log-verbose=1"
                - "--backend-config=onnxruntime,cpu-threads=2"
                - "--backend-config=onnxruntime,inter-op-parallelism=2"
                - "--backend-config=onnxruntime,intra-op-parallelism=2"
              resources:
                requests:
                  cpu: "1000m"
                  memory: "2Gi"
                limits:
                  cpu: "2000m"
                  memory: "4Gi"
              readinessProbe:
                httpGet:
                  path: /v2/health/ready
                  port: 8080
                initialDelaySeconds: 30
                periodSeconds: 10
                timeoutSeconds: 5
              livenessProbe:
                httpGet:
                  path: /v2/health/live
                  port: 8080
                initialDelaySeconds: 60
                periodSeconds: 30
                timeoutSeconds: 5
          nodeSelector:
            cloud.google.com/gke-nodepool: cpu-app-pool
          serviceAccountName: triton-sa
          metadata:
            annotations:
              autoscaling.knative.dev/target: "70"
              autoscaling.knative.dev/window: "30s"
              autoscaling.knative.dev/panic-window-percentage: "10"
              autoscaling.knative.dev/panic-threshold-percentage: "200"
              autoscaling.knative.dev/scale-to-zero-pod-retention-period: "5m"
---
apiVersion: v1
kind: Service
metadata:
  name: clinical-triton-service
  namespace: triton
  labels:
    app: clinical-triton
spec:
  type: ClusterIP
  selector:
    serving.kserve.io/inferenceservice: clinical-assertion
  ports:
    - name: grpc
      port: 8001
      targetPort: 8001
      protocol: TCP
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: metrics
      port: 8002
      targetPort: 8002
      protocol: TCP