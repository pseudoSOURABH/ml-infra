apiVersion: v1
kind: Service
metadata:
  name: clinical-assertion-http
  namespace: triton
  labels:
    app: clinical-assertion
spec:
  type: ClusterIP
  selector:
    serving.kserve.io/inferenceservice: clinical-assertion
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP