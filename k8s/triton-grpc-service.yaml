apiVersion: v1
kind: Service
metadata:
  name: clinical-assertion-grpc
  namespace: triton
  labels:
    app: clinical-assertion
spec:
  type: ClusterIP
  selector:
    serving.kserve.io/inferenceservice: clinical-assertion
  ports:
    - name: grpc
      port: 8001
      targetPort: 8001
      protocol: TCP