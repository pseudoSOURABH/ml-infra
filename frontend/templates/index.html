<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinical Assertion Classifier</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        .container { background: #f8f9fa; padding: 2rem; border-radius: 8px; }
        textarea { width: 100%; min-height: 100px; padding: 0.5rem; margin: 1rem 0; }
        button { background: #0d6efd; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0b5ed7; }
        button:disabled { background: #6c757d; cursor: not-allowed; }
        .result { margin-top: 1rem; padding: 1rem; background: white; border-radius: 4px; display: none; }
        .result.show { display: block; }
        .label { font-weight: bold; font-size: 1.2rem; }
        .score { color: #6c757d; }
        .error { color: #dc3545; }
        .examples { margin: 1rem 0; }
        .example { cursor: pointer; padding: 0.25rem; border-radius: 2px; }
        .example:hover { background: #e9ecef; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏥 Clinical Assertion Classifier</h1>
        <p>Classifies medical conditions in clinical text as PRESENT, ABSENT, or CONDITIONAL.</p>
        
        <div class="examples">
            <strong>Try these examples:</strong>
            <div class="example" onclick="fillExample('The patient denies chest pain.')">"The patient denies chest pain."</div>
            <div class="example" onclick="fillExample('He has a history of hypertension.')">"He has a history of hypertension."</div>
            <div class="example" onclick="fillExample('If the patient experiences dizziness, reduce the dosage.')">"If the patient experiences dizziness, reduce the dosage."</div>
        </div>
        
        <form id="predictForm">
            <textarea id="sentence" name="sentence" placeholder="Enter clinical text..." required></textarea>
            <button type="submit" id="submitBtn">Analyze</button>
        </form>
        
        <div id="result" class="result">
            <div>Result: <span id="label" class="label"></span></div>
            <div class="score">Confidence: <span id="score"></span></div>
        </div>
        <div id="error" class="result error"></div>
    </div>

    <script>
        function fillExample(text) {
            document.getElementById('sentence').value = text;
        }
        
        document.getElementById('predictForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const result = document.getElementById('result');
            const error = document.getElementById('error');
            const sentence = document.getElementById('sentence').value;
            
            btn.disabled = true;xq
            result.classList.remove('show');
            error.classList.remove('show');
            error.textContent = '';
            
            try {
                const formData = new FormData();
                formData.append('sentence', sentence);
                
                const response = await fetch('/api/predict', {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) throw new Error('Request failed');
                
                const data = await response.json();
                document.getElementById('label').textContent = data.label;
                document.getElementById('score').textContent = (data.score * 100).toFixed(2) + '%';
                result.classList.add('show');
            } catch (err) {
                error.textContent = 'Error: ' + err.message;
                error.classList.add('show');
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
